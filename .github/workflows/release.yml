# Release workflow — fires when a v* tag is pushed.
# GoReleaser builds 5 platform binaries, creates a GitHub Release, and uploads
# DEB/RPM packages. After GoReleaser runs, actions/attest@v4 generates a
# Sigstore-signed SLSA Build Provenance v1.0 attestation per artifact, published
# to GitHub's attestation API and verifiable with `gh attestation verify`.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write          # create the GitHub Release and upload artifacts
  id-token: write          # OIDC token for Sigstore keyless signing
  attestations: write      # publish attestations to GitHub's attestation API

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history for GoReleaser)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: ./dist/checksums.txt
